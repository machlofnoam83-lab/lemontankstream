# ═══════════════════════════════════════════════════════════════════════════
#  Fail2ban — חסימה ברמת חומת האש של כתובות שנתפסו ע"י שער האבטחה
#
#  התקנה:
#    1. cp deploy/fail2ban-lemontank.conf /etc/fail2ban/filter.d/lemontank.conf
#    2. cp deploy/fail2ban-jail.local      /etc/fail2ban/jail.d/lemontank.local
#    3. systemctl restart fail2ban && fail2ban-client status lemontank
#
#  הלוג שהשער כותב: כל חסימה נרשמת גם ל-data/security-blocked.log (JSON שורה אחת)
# ═══════════════════════════════════════════════════════════════════════════

[Definition]
failregex = ^.*"event":"blocked".*"ip":"<HOST>".*$
            ^.*"event":"banned".*"ip":"<HOST>".*$
ignoreregex = ^.*"ip":"(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.).*$
