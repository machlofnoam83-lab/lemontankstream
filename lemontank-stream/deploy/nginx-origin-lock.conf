# ═══════════════════════════════════════════════════════════════════════════
#  נעילת מקור ב-nginx — שכבת הגנה שנייה מעל שער האבטחה
#
#  העיקרון:  כל בקשה שלא מגיעה מ-Cloudflare (או מכתובת מורשית) **נסגרת
#  בשקט** עם `return 444` — nginx סוגר את החיבור בלי לשלוח שום תשובה.
#  סורק שרואה 444 מסיק שהפורט סגור או מסונן, וממשיך הלאה.
#
#  התקנה:  /etc/nginx/sites-available/lemontank-origin
#  החלף:   <ORIGIN_TOKEN>  ואת טווחי Cloudflare אם הם מתעדכנים
# ═══════════════════════════════════════════════════════════════════════════

# ── 1. טווחי Cloudflare (מתעדכן: node scripts/stealth.mjs allow --cloudflare) ──
geo $cloudflare {
    default 0;

    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;

    # ── הכתובות שלך (משרד / VPS ניהול) — הוסף כאן ─────────────────────────
    # 203.0.113.10/32  1;
}

map $cloudflare $origin_secret_ok {
    default                    0;
    0                          "deny";          # לא מ-Cloudflare → דחייה שקטה
    1                          $http_x_lt_origin;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # ── כל כתובת לא מוכרת: חיבור נסגר בלי תשובה ────────────────────────────
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2;
    server_name lemontank.co.il www.lemontank.co.il;

    # ── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/lemontank.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemontank.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # ── אימות הדדי מול Cloudflare (Authenticated Origin Pull) ──────────────
    # מוודא שהבקשה מגיעה מ-Cloudflare עצמו ולא ממי שמזייף כותרות.
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client      on;

    # ── הסתרת זהות ─────────────────────────────────────────────────────────
    server_tokens off;
    more_clear_headers Server;          # דורש nginx-extras; אחרת משתמשים ב-headers-more
    add_header X-Content-Type-Options nosniff always;

    # ── נעילת מקור ─────────────────────────────────────────────────────────
    if ($cloudflare = 0) { return 444; }                    # לא מ-Cloudflare
    if ($http_x_lt_origin != "<ORIGIN_TOKEN>") { return 444; }   # בלי הסימן הסודי
    if ($http_host !~* "^(www\.)?lemontank\.co\.il$") { return 444; }  # Host זר

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/lt-proxy.conf;
    }
}
