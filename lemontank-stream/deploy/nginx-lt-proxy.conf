# ═══════════════════════════════════════════════════════════════════════════
#  העברת כותרות ל-LemonTank — מניחים ב-/etc/nginx/snippets/lt-proxy.conf
#  חשוב: TRUST_PROXY="strict" + TRUSTED_PROXY_CIDRS="127.0.0.1/32" ב-.env.local
# ═══════════════════════════════════════════════════════════════════════════

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# כותרות שהלקוח שלח ואסור שיגיעו לאפליקציה (השער מנקה גם בעצמו — שכבה כפולה)
proxy_set_header Proxy-Connection  "";
proxy_set_header X-Originating-IP  "";

# העלאות וידאו ארוכות
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
