# ═══════════════════════════════════════════════════════════════════════════
#  LemonTank Stream — nginx: שכבת הגנה נוספת מעל שער האבטחה
#  התקנה:  /etc/nginx/sites-available/lemontank
#  (העתק את הבלוקים לתוך server{} הקיים שלך)
# ═══════════════════════════════════════════════════════════════════════════

# ── 1. הסתרת זהות השרת ─────────────────────────────────────────────────────
#   ב-/etc/nginx/nginx.conf:  server_tokens off;

# ── 2. הגבלת נפח וקצב בשכבת ה-proxy ────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=lt_api:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=lt_login:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=lt_conn:10m;
client_max_body_size 2g;              # העלאות וידאו
client_body_timeout  60s;
client_header_timeout 15s;
large_client_header_buffers 4 8k;     # מגביל כותרות ענק (הברחת בקשות)

server {
    listen 80;
    server_name lemontank.co.il www.lemontank.co.il;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lemontank.co.il www.lemontank.co.il;

    # ── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/lemontank.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemontank.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── הגנות בסיס ─────────────────────────────────────────────────────────
    server_tokens off;
    limit_conn lt_conn 40;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # דחיית מתודות מיותרות עוד לפני האפליקציה
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # חסימת נתיבי סריקה נפוצים (השער של האפליקציה עושה זאת גם — זוהי שכבה כפולה)
    location ~* ^/(\.env|\.git|wp-|phpmyadmin|xmlrpc\.php|vendor/|\.aws|\.ssh|data/|scripts/|security/) {
        return 403;
    }

    location /api/auth/ {
        limit_req zone=lt_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/lt-proxy.conf;
    }

    location /api/ {
        limit_req zone=lt_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/lt-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/lt-proxy.conf;
    }

    # קבצים סטטיים — ישירות מ-nginx (מהיר יותר, פחות עומס על Node)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
