<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="מלחמת הכוכבים: תקווה חדשה">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#2a0b06"/>
      <stop offset="55%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a3c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <g>
      <circle cx="348" cy="389" r="76" fill="#ff5a3c" opacity="0.38"/>
      <path d="M-40 583 Q 160 494 340 577 T 640 570 L 640 900 L -40 900 Z" fill="#2a0b06" opacity="0.92"/>
  </g>
  <rect width="600" height="900" fill="url(#fade)"/>

  <!-- תג עליון -->
  <g font-family="Heebo, Assistant, Arial, sans-serif" direction="rtl">
    <rect x="416" y="34" width="176" height="34" rx="17" fill="#ff5a3c" opacity="0.92"/>
    <text x="491" y="57" text-anchor="middle" font-size="17" font-weight="800" fill="#0a0a10">סרט · פלוס</text>
    <text x="34" y="58" font-size="16" font-weight="700" fill="#ffb199" opacity="0.9" direction="ltr" text-anchor="start">LEMONTANK</text>
  </g>

  <!-- כותרת -->
  <g font-family="Heebo, Assistant, Rubik, Arial, sans-serif">
    <text x="300" y="664" text-anchor="middle" direction="rtl" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">מלחמת הכוכבים: תקווה</text>
    <text x="300" y="732" text-anchor="middle" direction="rtl" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">חדשה</text>
  </g>

  <!-- מטא -->
  <g font-family="Heebo, Assistant, Arial, sans-serif" direction="rtl">
    <line x1="150" y1="770" x2="450" y2="770" stroke="#ff5a3c" stroke-width="2" opacity="0.65"/>
    <text x="300" y="800" text-anchor="middle" font-size="23" font-weight="700" fill="#ffb199" opacity="0.95">1977 · 121 דק׳ · ★ 8.6</text>
    <text x="300" y="832" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff" opacity="0.62" direction="ltr">Star Wars</text>
  </g>

  <rect x="0.5" y="0.5" width="599" height="899" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
